<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>精读辅助 · 音频同步字幕</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#171a1f; --muted:#626b78;
  --line:#e3e6eb; --accent:#2559d6; --accent-soft:#e9effc;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.appbar{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.appbar .inner{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.appbar h1{font-size:17px;font-weight:650;flex:1;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;background:var(--surface);max-width:46vw}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
main{max-width:760px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
.ep-title{font-size:18px;font-weight:650;line-height:1.4;word-break:break-word}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:44px;min-width:44px}
.btn:hover{border-color:#c9ced6}
.btn--primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:#b9cbf3;color:var(--accent);font-weight:600}
.btn .ico{font-size:16px}
.time{font-variant-numeric:tabular-nums;white-space:nowrap}
.speed{display:flex;gap:6px;flex-wrap:wrap}
.speed .btn{padding:6px 10px;min-height:40px;font-size:14px}
/* 字幕区 */
.subs{
  height:min(56vh,560px);overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  scroll-behavior:auto; padding:8px; overscroll-behavior:contain;
}
.sub{
  display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  padding:10px 12px;border-radius:10px;line-height:1.55;word-break:break-word;
  color:var(--ink);border-left:3px solid transparent;
}
.sub:hover{background:#f0f3fa}
.sub[aria-current="true"]{
  background:var(--accent-soft);border-left-color:var(--accent);font-weight:600;
}
.sub .idx{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;margin-right:8px}
.hintbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
kbd{background:#f0f2f5;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:12px}
dialog{border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);max-width:420px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.35)}
.status{position:fixed;left:-9999px}
.banner{background:var(--warn-soft,#fdf1dc);border:1px solid #ecd3a0;color:#8a5300;border-radius:10px;padding:8px 12px;font-size:14px}
@supports not (overscroll-behavior:contain){.subs{height:480px}}
/* 触摸设备：大按钮控制条替代键盘；字幕区留给内容 */
.touch{display:none}
@media (pointer:coarse){
  .touch{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
  .touch .btn{min-height:54px;font-size:15px;padding:6px 4px;display:flex;align-items:center;justify-content:center}
  .hintbar .kb{display:none}
  .sub{padding:12px 10px}
  main{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  .appbar .inner{padding-top:calc(6px + env(safe-area-inset-top))}
}
@media (pointer:coarse){.subs{height:min(46dvh,520px)}}
@supports not (height:100dvh){@media (pointer:coarse){.subs{height:min(46vh,520px)}}}
</style>
</head>
<body>
<header class="appbar">
  <div class="inner">
    <h1>精读辅助</h1>
    <label class="sr-only" for="epSel" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">选择集数</label>
    <select id="epSel" aria-label="选择集数"></select>
  </div>
</header>
<main>
  <div id="banner" class="banner" hidden></div>
  <section class="card">
    <div class="ep-title" id="epTitle"></div>
    <div class="tiny muted" id="epMeta"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn--primary" id="playBtn" aria-label="播放"><span class="ico" id="playIco">▶</span></button>
      <span class="time small" id="timeNow">0:00</span>
      <span class="muted">/</span>
      <span class="time small muted" id="timeTotal">–:––</span>
      <div class="speed" id="speedBox" role="group" aria-label="播放速率"></div>
    </div>
    <div class="touch" id="touchBar" role="group" aria-label="播放控制">
      <button class="btn" type="button" data-act="prev" aria-label="上一句">⏮ 句</button>
      <button class="btn" type="button" data-act="back" aria-label="后退 10 秒">−10s</button>
      <button class="btn" type="button" data-act="play" id="tpPlay" aria-label="播放">▶</button>
      <button class="btn" type="button" data-act="fwd" aria-label="前进 10 秒">+10s</button>
      <button class="btn" type="button" data-act="next" aria-label="下一句">⏭ 句</button>
    </div>
    <div class="row spread" style="margin-top:6px">
      <span class="tiny muted" id="sentNo">–</span>
      <span class="tiny muted" id="loadState"></span>
      <span class="tiny muted" id="cacheState"></span>
    </div>
  </section>
  <div class="subs" id="subs" tabindex="0" aria-label="字幕列表，点击句子跳转播放"></div>
  <div class="hintbar small">
    <label class="row" style="gap:6px;cursor:pointer;user-select:none">
      <input type="checkbox" id="followChk" checked style="width:18px;height:18px;accent-color:var(--accent)">
      <span>同步滚动</span>
    </label>
    <span class="muted kb"><kbd>↑</kbd><kbd>↓</kbd> 句 <kbd>←</kbd><kbd>→</kbd> ±10s <kbd>Space</kbd> 播放 <kbd>?</kbd> 帮助</span>
    <button class="btn small" id="helpBtn" style="min-height:32px;padding:4px 10px">快捷键</button>
  </div>
</main>
<dialog id="helpDlg" aria-labelledby="helpTitle">
  <h2 id="helpTitle" style="margin:0 0 10px;font-size:16px">快捷键</h2>
  <p style="margin:6px 0"><kbd>↑</kbd> / <kbd>↓</kbd>：上一句 / 下一句</p>
  <p style="margin:6px 0"><kbd>←</kbd> / <kbd>→</kbd>：后退 / 前进 10 秒</p>
  <p style="margin:6px 0"><kbd>Space</kbd>：播放 / 暂停</p>
  <p style="margin:6px 0"><kbd>Enter</kbd>：聚焦句子时跳转该句</p>
  <p style="margin:6px 0" class="muted small">点击任意句子可跳转；「同步滚动」开启时当前句保持在字幕区中部，手动滚动会临时暂停跟随，约 4 秒后自动恢复（点句子或 ±10s 也会立即恢复）。</p>
  <div style="text-align:right;margin-top:12px"><button class="btn btn--primary" id="helpClose">知道了</button></div>
</dialog>
<div class="status" id="live" aria-live="polite"></div>
<audio id="player" preload="metadata" tabindex="-1"></audio>
<script id="site-data" type="application/json">__SITE_DATA__</script>
<script id="site-config" type="application/json">__SITE_CONFIG__</script>
<script>
"use strict";
(function(){
  var DATA = JSON.parse(document.getElementById("site-data").textContent);
  var CFG = JSON.parse(document.getElementById("site-config").textContent);
  var AUDIO_BASE = CFG.audioBase;
  var eps = DATA.eps;   // [{no,file_stem,title,dur_min,sents:[[s,e,text],...]}]
  var $ = function(id){ return document.getElementById(id); };
  var player=$("player"), subsEl=$("subs"), epSel=$("epSel"), playBtn=$("playBtn"), playIco=$("playIco");
  var timeNow=$("timeNow"), timeTotal=$("timeTotal"), sentNo=$("sentNo"), live=$("live"), loadState=$("loadState");
  var cacheState=$("cacheState");
  var epTitle=$("epTitle"), epMeta=$("epMeta"), banner=$("banner");

  // ---------- localStorage（file:// 各浏览器分区不同；一律 try/catch） ----------
  // 同一域名下多季共用 /s1/、/s2/ 子路径时，靠 NS 隔离进度，避免互相覆盖
  var NS = CFG.ns ? CFG.ns + ":" : "";
  var store = {
    get:function(k){ try{ return localStorage.getItem(NS + k); }catch(e){ return null; } },
    set:function(k,v){ try{ localStorage.setItem(NS + k, v); }catch(e){} },
  };

  // ---------- 状态 ----------
  var cur = { ep:null, sents:[], idx:-1, metaReady:false, pendingSeek:null };
  var lastSave = 0, lastArrow = 0;
  var followChk = $("followChk");
  // 同步滚动开关：勾选=跟随进度自动滚动（当前句居中）；手动滚动字幕会临时暂停跟随，句切换/seek 恢复
  followChk.checked = store.get("wh:intensive:follow") !== "0";
  var follow = followChk.checked;
  followChk.addEventListener("change", function(){
    follow = followChk.checked;
    store.set("wh:intensive:follow", follow ? "1" : "0");
    announce(follow ? "同步滚动已开启" : "同步滚动已关闭");
    if(follow && cur.idx >= 0) scrollSub(subsEl.children[cur.idx]);
  });
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function fmt(t){
    if(!isFinite(t)) return "–:––";
    t = Math.max(0, Math.round(t));
    var h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
    var mm = h ? String(m).padStart(2,"0") : String(m);
    return (h ? h + ":" : "") + mm + ":" + String(s).padStart(2,"0");
  }
  function announce(msg){ live.textContent = msg; }

  // ---------- 集列表 ----------
  eps.forEach(function(ep, i){
    var opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = String(ep.no).padStart(2,"0") + " · " + ep.title + " (" + Math.round(ep.dur_min) + "min)";
    epSel.appendChild(opt);
  });
  var savedEp = parseInt(store.get("wh:intensive:ep") || "0", 10);
  if(isNaN(savedEp) || savedEp < 0 || savedEp >= eps.length) savedEp = 0;
  epSel.value = String(savedEp);

  // ---------- 字幕渲染（只渲染当前集；服务器模式按集懒加载） ----------
  var SENTS_BASE = CFG.sentsBase || "";     // 为空表示字幕已内联（单文件/file:// 模式）
  var sentsCache = Object.create(null);     // stem -> sents，切回已看过的集 0 请求
  var sentsToken = 0;

  function epCount(ep){ return ep.n != null ? ep.n : (ep.sents ? ep.sents.length : 0); }

  function paintSubs(){
    subsEl.textContent = "";
    var frag = document.createDocumentFragment();
    cur.sents.forEach(function(s, j){
      var b = document.createElement("button");
      b.className = "sub"; b.type = "button";
      b.dataset.i = String(j);
      b.setAttribute("aria-current", "false");
      var idx = document.createElement("span");
      idx.className = "idx"; idx.textContent = String(j+1);
      b.appendChild(idx);
      b.appendChild(document.createTextNode(s[2]));   // textContent 防注入
      frag.appendChild(b);
    });
    subsEl.appendChild(frag);
    updateSentNo();
  }

  function applySents(ep, rows){
    if(cur.ep !== ep) return;
    cur.sents = rows;
    paintSubs();
    loadState.textContent = "";
    if(cur.metaReady) refresh(playTime());
  }

  function loadSents(ep){
    var key = ep.file_stem;
    if(sentsCache[key]){ applySents(ep, sentsCache[key]); return; }
    var token = ++sentsToken;
    var ctrl = window.AbortController ? new AbortController() : null;
    cur.sentsCtrl = ctrl;
    loadState.textContent = "加载字幕…";
    fetch(SENTS_BASE + encodeURIComponent(key) + ".json", ctrl ? {signal: ctrl.signal} : undefined)
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(rows){
        if(token !== sentsToken || cur.ep !== ep) return;
        if(!rows || !rows.length) throw new Error("空字幕");
        sentsCache[key] = rows;
        applySents(ep, rows);
      })
      .catch(function(err){
        if(token !== sentsToken || (err && err.name === "AbortError")) return;
        loadState.textContent = "字幕加载失败，点此重试";
        announce("字幕加载失败，可点此重试");
      });
  }

  function renderEpisode(i){
    var ep = eps[i];
    if(typeof resetCache === "function") resetCache();
    if(cur.sentsCtrl){ try{ cur.sentsCtrl.abort(); }catch(e){} cur.sentsCtrl = null; }
    sentsToken++;                      // 作废上一集在途的字幕请求
    cur.ep = ep; cur.sents = ep.sents || []; cur.idx = -1; cur.metaReady = false;
    epTitle.textContent = String(ep.no).padStart(2,"0") + " · " + ep.title;
    epMeta.textContent = epCount(ep) + " 句 · 约 " + Math.round(ep.dur_min) + " 分钟";
    setMediaMeta(ep);
    subsEl.textContent = "";
    if(cur.sents.length) paintSubs(); else sentNo.textContent = "– / " + epCount(ep);
    player.src = audioUrl(ep);
    loadState.textContent = "加载中…";
    timeTotal.textContent = "–:––";
    timeNow.textContent = "0:00";
    if(SENTS_BASE && !ep.sents) loadSents(ep);
    schedulePrefetch();
  }

  loadState.addEventListener("click", function(){
    if(SENTS_BASE && cur.ep && !cur.sents.length) loadSents(cur.ep);
  });

  // ---------- 整集缓存（fetch -> Blob；换源后同集内拖动完全本地） ----------
  var PREFETCH = CFG.prefetch !== false;
  var PREFETCH_MAX = 64 * 1048576;
  var cache = { token:0, ctrl:null, state:"idle", recv:0, total:0, url:null, ep:null };

  function cacheLabel(msg){ cacheState.textContent = msg || ""; }
  var AUDIO_VER = CFG.audioVersion || "";
  function audioUrl(ep){
    return AUDIO_BASE + encodeURIComponent(ep.file_stem) + ".m4a"
         + (AUDIO_VER ? "?v=" + encodeURIComponent(AUDIO_VER) : "");
  }
  function playTime(){ return cur.swap ? cur.swap.t : (player.currentTime || 0); }
  function curRate(){ return cur.swap ? cur.swap.rate : (player.playbackRate || 1); }

  function resetCache(){
    cache.token++;                      // 作废在途请求与进度回调
    cache.state = "idle"; cache.ep = null; cache.recv = cache.total = 0;
    if(cache.ctrl){ try{ cache.ctrl.abort(); }catch(e){} cache.ctrl = null; }
    cur.swap = null;
    var old = cache.url; cache.url = null;
    cacheLabel("");
    if(old) setTimeout(function(){ try{ URL.revokeObjectURL(old); }catch(e){} }, 2000);
  }

  function paintCache(got, total){
    if(!total){ cacheLabel("缓存整集 " + (got / 1048576).toFixed(1) + " MB"); return; }
    var pct = Math.min(100, Math.round(got * 100 / total));
    cacheLabel("缓存整集 " + pct + "%");
  }

  function startPrefetch(ep){
    if(!PREFETCH || location.protocol === "file:") return;
    if(!window.fetch || !window.Blob || !URL.createObjectURL) return;
    var token = cache.token;
    cache.state = "fetching"; cache.ep = ep; cache.recv = 0; cache.total = 0;
    cache.ctrl = window.AbortController ? new AbortController() : null;
    cacheLabel("缓存整集 0%");
    fetch(audioUrl(ep), cache.ctrl ? {signal: cache.ctrl.signal} : undefined)
      .then(function(res){
        if(!res.ok) throw new Error("HTTP " + res.status);
        var len = parseInt(res.headers.get("Content-Length") || "0", 10);
        if(len > PREFETCH_MAX) throw new Error("too-large");
        cache.total = len;
        if(!res.body || !res.body.getReader) return res.blob();
        var reader = res.body.getReader(), chunks = [], got = 0;
        function pump(){
          return reader.read().then(function(r){
            if(token !== cache.token) throw new Error("stale");
            if(r.done) return new Blob(chunks, {type:"audio/mp4"});
            chunks.push(r.value); got += r.value.length; cache.recv = got;
            paintCache(got, len);
            if(got > PREFETCH_MAX) throw new Error("too-large");
            return pump();
          });
        }
        return pump();
      })
      .then(function(blob){
        if(token !== cache.token || cur.ep !== ep) return;      // 切集竞态：丢弃
        if(cache.total && blob.size !== cache.total) throw new Error("truncated");
        attachBlob(ep, URL.createObjectURL(blob), token);
      })
      .catch(function(err){
        if(token !== cache.token) return;
        if(err && err.name === "AbortError"){ cache.state = "idle"; return; }
        cache.state = "failed";
        cacheLabel("整集缓存失败，可在线播放");
      });
  }

  function attachBlob(ep, url, token){
    if(token !== cache.token || cur.ep !== ep){ try{ URL.revokeObjectURL(url); }catch(e){} return; }
    cache.url = url; cache.state = "ready";
    cur.swap = { t: player.currentTime || 0,
                 playing: !player.paused && !player.ended,
                 rate: player.playbackRate || 1 };
    cur.metaReady = false;
    player.src = url;
    player.load();
    cacheLabel("整集已缓存 · 本地拖动");
  }

  function schedulePrefetch(){
    if(!PREFETCH || cache.state !== "idle") return;
    var ep = cur.ep;
    setTimeout(function(){
      if(ep === cur.ep && cache.state === "idle") startPrefetch(ep);
    }, 300);
  }

  // ---------- 高亮与滚动 ----------
  function findIdx(t){
    var s = cur.sents, lo = 0, hi = s.length - 1, ans = -1;
    while(lo <= hi){
      var mid = (lo + hi) >> 1;
      if(t >= s[mid][0]){ ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;   // gap 期间保持上一句（start<=t<next.start）
  }
  var progScrollUntil = 0;   // 程序滚动窗口：此时刻前的 scroll 事件都是平滑滚动动画自身发出的
  function scrollSub(el){
    // 当前句置于字幕显示区中部：上下句可见，便于精读对照。
    // 用 rect 相对计算：subs 无 position 定位时 offsetTop 是相对页面的，会算错
    var rel = el.getBoundingClientRect().top - subsEl.getBoundingClientRect().top;
    var target = subsEl.scrollTop + rel - subsEl.clientHeight/2 + el.clientHeight/2;
    if(reduceMotion){
      subsEl.scrollTop = target;
    } else {
      subsEl.scrollTo({top:target, behavior:"smooth"});
    }
    // smooth 滚动会连续触发几十个 scroll 事件，计数器必被击穿；改用时间窗口
    progScrollUntil = Date.now() + 700;
  }
  function setIdx(i, opts){
    opts = opts || {};
    if(i < 0 || i >= cur.sents.length) return;
    if(cur.idx === i && !opts.force) { updateSentNo(); return; }
    if(cur.idx >= 0){
      var prev = subsEl.children[cur.idx];
      if(prev) prev.setAttribute("aria-current","false");
    }
    cur.idx = i;
    var el = subsEl.children[i];
    el.setAttribute("aria-current","true");
    if(follow || opts.scroll) scrollSub(el);
    updateSentNo();
  }
  function updateSentNo(){
    sentNo.textContent = cur.idx >= 0 ? (cur.idx+1) + " / " + cur.sents.length : "– / " + cur.sents.length;
  }

  // 手动滚动只认真实用户手势：滚轮 / 触摸 / 按住滚动条拖动。
  // 不能靠 scroll 事件判手动——程序 smooth 滚动的几十个 scroll 事件会被误判。
  // 手动接管后暂停跟随，4 秒无操作自动恢复（勾选框仍开启时）
  var manualTimer = null;
  function pauseFollow(){
    if(!followChk.checked) return;
    follow = false;
    if(manualTimer) clearTimeout(manualTimer);
    manualTimer = setTimeout(function(){ restoreFollow(); }, 4000);
  }
  ["wheel", "touchstart"].forEach(function(ev){
    subsEl.addEventListener(ev, pauseFollow, {passive:true});
  });
  subsEl.addEventListener("pointerdown", function(e){
    // 按住的是滚动条（宽度内 16px）也视为手动接管
    if(e.clientX > subsEl.getBoundingClientRect().right - 16) pauseFollow();
  });
  function restoreFollow(){
    if(!followChk.checked) return;
    follow = true;
    if(manualTimer){ clearTimeout(manualTimer); manualTimer = null; }
    if(cur.idx >= 0) scrollSub(subsEl.children[cur.idx]);
  }

  // ---------- 播放控制 ----------
  function seekTo(t){
    if(!cur.metaReady){ cur.pendingSeek = t; return; }
    player.currentTime = t;
    refresh(t);
    restoreFollow();   // 用户主动 seek（点句/±10s）即恢复自动跟随
    savePos(true);
  }
  function goToSentence(i){
    if(i < 0 || i >= cur.sents.length) return;
    setIdx(i);
    seekTo(cur.sents[i][0]);   // restoreFollow 会把当前句滚到中部
  }
  function togglePlay(){
    if(player.paused) player.play().catch(function(){
      banner.hidden = false; banner.textContent = "浏览器阻止了自动播放，请再按一次播放按钮。";
    });
    else player.pause();
  }
  function refresh(t){
    var i = findIdx(t);
    if(i >= 0) setIdx(i);
    timeNow.textContent = fmt(t);
  }
  function savePos(force){
    var now = Date.now();
    if(!force && now - lastSave < 5000) return;
    lastSave = now;
    store.set("wh:intensive:pos:" + cur.ep.file_stem, String(playTime()));
    store.set("wh:intensive:rate", String(curRate()));
  }

  player.addEventListener("loadedmetadata", function(){
    cur.metaReady = true;
    timeTotal.textContent = fmt(player.duration);
    loadState.textContent = "";
    if(cur.swap){                       // 刚从网络源换到 Blob：恢复位置/倍速/播放态
      var sw = cur.swap; cur.swap = null;
      var target = (cur.pendingSeek != null) ? cur.pendingSeek : sw.t;
      cur.pendingSeek = null;
      try{
        player.currentTime = Math.min(Math.max(0, target), Math.max(0, player.duration - 0.05));
      }catch(e){}
      player.playbackRate = sw.rate;
      if(sw.playing) player.play().catch(function(){ paintPlay(false); });
      refresh(target);
      return;
    }
    if(cur.pendingSeek != null){ player.currentTime = cur.pendingSeek; cur.pendingSeek = null; }
    else {
      var saved = parseFloat(store.get("wh:intensive:pos:" + cur.ep.file_stem) || "0");
      if(saved > 0 && saved < player.duration - 1){ player.currentTime = saved; announce("已恢复到上次位置"); }
    }
    applyRate();
    refresh(player.currentTime);
  });
  var lastPosSync = 0;
  player.addEventListener("timeupdate", function(){
    if(cur.swap) return;
    refresh(player.currentTime);
    savePos(false);
    var now = Date.now();
    if(now - lastPosSync > 1000){ lastPosSync = now; syncPosState(); }
  });
  function paintPlay(playing){
    var icon = playing ? "⏸" : "▶";
    var label = playing ? "暂停" : "播放";
    playIco.textContent = icon; playBtn.setAttribute("aria-label", label);
    var tp = $("tpPlay");
    if(tp){ tp.textContent = icon; tp.setAttribute("aria-label", label); }
    if(navigator.mediaSession) navigator.mediaSession.playbackState = playing ? "playing" : "paused";
  }
  player.addEventListener("play", function(){
    paintPlay(true);
    applyRate(); savePos(true);
  });
  player.addEventListener("pause", function(){
    paintPlay(false); savePos(true);
  });
  player.addEventListener("ended", function(){
    paintPlay(false); savePos(true);
  });
  player.addEventListener("error", function(){
    var src = player.currentSrc || "";
    if(src.indexOf("blob:") === 0 && cur.ep){    // Blob 异常：回退网络源，别让人卡死
      var t = playTime(), wasPlaying = !player.paused;
      cur.swap = { t: t, playing: wasPlaying, rate: curRate() };
      cur.metaReady = false;
      player.src = audioUrl(cur.ep);
      player.load();
      banner.hidden = false; banner.textContent = "本地缓存异常，已回退在线播放。";
      return;
    }
    loadState.textContent = "音频加载失败";
    banner.hidden = false; banner.textContent = "找不到 " + AUDIO_BASE + cur.ep.file_stem + ".m4a（请确认音频目录）";
  });

  // ---------- 变速 ----------
  var SPEEDS = [0.75, 1, 1.25, 1.5];
  var speedBox = $("speedBox");
  function applyRate(){
    var r = parseFloat(store.get("wh:intensive:rate") || "1");
    if(SPEEDS.indexOf(r) < 0) r = 1;
    player.playbackRate = r;
    SPEEDS.forEach(function(s){
      var b = speedBox.querySelector('[data-rate="' + s + '"]');
      if(b) b.setAttribute("aria-pressed", String(s === r));
    });
  }
  SPEEDS.forEach(function(s){
    var b = document.createElement("button");
    b.className = "btn"; b.type = "button"; b.dataset.rate = String(s);
    b.textContent = s + "×";
    b.addEventListener("click", function(){
      player.playbackRate = s;
      if(cur.swap) cur.swap.rate = s;
      store.set("wh:intensive:rate", String(s));
      applyRate();
      announce("播放速率 " + s + "×");
    });
    speedBox.appendChild(b);
  });

  // ---------- 键盘 ----------
  function onArrow(){
    var now = Date.now();
    if(now - lastArrow < 150) return true;   // 长按连发节流
    lastArrow = now;
    return false;
  }
  document.addEventListener("keydown", function(e){
    var tag = (e.target.tagName || "").toLowerCase();
    if(tag === "input" || tag === "select" || tag === "textarea") return;
    switch(e.key){
      case "ArrowUp": e.preventDefault(); goToSentence(cur.idx - 1); break;
      case "ArrowDown": e.preventDefault(); goToSentence(cur.idx + 1); break;
      case "ArrowLeft": e.preventDefault(); if(!onArrow()) seekTo(Math.max(0, playTime() - 10)); break;
      case "ArrowRight": e.preventDefault(); if(!onArrow()) seekTo(playTime() + 10); break;
      case " ": case "Spacebar": e.preventDefault(); togglePlay(); break;
      case "?": e.preventDefault(); helpDlg.showModal(); break;
      case "Enter":
        if(e.target.classList && e.target.classList.contains("sub")){
          e.preventDefault(); goToSentence(parseInt(e.target.dataset.i, 10));
        }
        break;
    }
  });

  subsEl.addEventListener("click", function(e){
    var b = e.target.closest(".sub");
    if(b) goToSentence(parseInt(b.dataset.i, 10));
  });
  playBtn.addEventListener("click", togglePlay);

  // ---------- 触摸控制条（手机） ----------
  $("touchBar").addEventListener("click", function(e){
    var b = e.target.closest("[data-act]");
    if(!b) return;
    var act = b.dataset.act;
    if(act === "prev") goToSentence(cur.idx - 1);
    else if(act === "next") goToSentence(cur.idx + 1);
    else if(act === "back") seekTo(Math.max(0, playTime() - 10));
    else if(act === "fwd") seekTo(playTime() + 10);
    else if(act === "play") togglePlay();
  });

  // ---------- 锁屏 / 通知栏（Media Session） ----------
  var ms = navigator.mediaSession;
  function setMediaMeta(ep){
    if(!ms || !window.MediaMetadata) return;
    try{
      ms.metadata = new MediaMetadata({
        title: String(ep.no).padStart(2, "0") + " · " + ep.title,
        artist: "精读辅助",
        album: "商务英语 67 集"
      });
    }catch(e){}
  }
  function syncPosState(){
    if(!ms || !ms.setPositionState) return;
    if(cur.swap || !cur.metaReady || !isFinite(player.duration) || player.duration <= 0) return;
    try{
      ms.setPositionState({
        duration: player.duration,
        position: Math.min(playTime(), player.duration),
        playbackRate: curRate()
      });
    }catch(e){}
  }
  if(ms && ms.setActionHandler){
    var msActions = {
      play: togglePlay,
      pause: function(){ player.pause(); },
      seekbackward: function(){ seekTo(Math.max(0, playTime() - 10)); },
      seekforward: function(){ seekTo(playTime() + 10); },
      previoustrack: function(){ goToSentence(cur.idx - 1); },
      nexttrack: function(){ goToSentence(cur.idx + 1); }
    };
    Object.keys(msActions).forEach(function(k){
      try{ ms.setActionHandler(k, msActions[k]); }catch(e){}
    });
  }

  var helpDlg = $("helpDlg");
  $("helpBtn").addEventListener("click", function(){ helpDlg.showModal(); });
  $("helpClose").addEventListener("click", function(){ helpDlg.close(); });
  epSel.addEventListener("change", function(){
    store.set("wh:intensive:ep", epSel.value);
    renderEpisode(parseInt(epSel.value, 10));
    epSel.blur();   // 防焦点停留在 select 上时方向键误触发
  });
  window.addEventListener("beforeunload", savePos);

  // ---------- 启动 ----------
  renderEpisode(savedEp);
  applyRate();
})();
</script>
</body>
</html>
