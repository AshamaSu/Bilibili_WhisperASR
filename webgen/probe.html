<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>能力探针 · 精读页移动端</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#171a1f;--muted:#626b78;--line:#e3e6eb;
  --ok:#1a7f4b;--warn:#a86400;--bad:#c0362c;--accent:#2559d6}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--surface:#191d23;--ink:#e8ecf2;
  --muted:#98a2b3;--line:#2a3038;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--accent:#7ba3ff}}
*{box-sizing:border-box}
body{margin:0;padding:14px 14px calc(28px + env(safe-area-inset-bottom));background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.verdict{font-weight:600;line-height:1.5;word-break:break-word}
.verdict.ok{color:var(--ok)}.verdict.warn{color:var(--warn)}.verdict.bad{color:var(--bad)}
.verdict small{display:block;font-weight:400;color:var(--muted);margin-top:6px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td.k{width:38%;color:var(--muted);padding-right:8px}
td.v{word-break:break-word;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;
  margin-right:6px;vertical-align:1px;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.na{color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px;font-size:12px;margin:0;max-height:44vh;overflow:auto}
button{font:inherit;min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
h2{font-size:14px;margin:16px 0 8px;color:var(--muted);font-weight:600}
</style>
</head>

var rows = { env: [], store: [], audio: [], mobile: [] };
var report = [];

function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}
function add(group, label, state, value){
  var tr = document.createElement("tr");
  var td1 = el("td", "k", label);
  var td2 = el("td", "v");
  var map = { ok:"✅", warn:"⚠️", bad:"❌", na:"—" };
  td2.appendChild(el("span", "tag " + state, map[state] || "•"));
  td2.appendChild(document.createTextNode(value == null ? "" : String(value)));
  tr.appendChild(td1); tr.appendChild(td2);
  document.getElementById("tb-" + group).appendChild(tr);
  report.push(label + ": " + (value == null ? "" : value) + "  [" + state + "]");
}
function errText(e){ return (e && (e.name || "Error")) + " — " + (e && e.message ? e.message : ""); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

var facts = { secure:false, sw:false, cache:false, aac:false };

/* ---------- 环境 ---------- */
(function(){
  var ua = navigator.userAgent || "";
  var m = ua.match(/(Chrome|CriOS|Quark|UCBrowser|Firefox|Edg|SamsungBrowser)\/([\d.]+)/);
  add("env", "User-Agent", "na", ua);
  add("env", "内核/版本", m ? "ok" : "warn", m ? (m[1] + " " + m[2]) : "未能识别（可能是定制内核）");
  add("env", "Origin", "na", location.origin === "null" ? "null（opaque，file:// 或 data:）" : location.origin);
  facts.secure = !!window.isSecureContext;
  add("env", "安全上下文", facts.secure ? "ok" : "warn",
      facts.secure ? "是（SW / Cache / persist 可用）"
                   : "否 —— SW 与 Cache 在本 origin 上一律无效，不能据此判断浏览器不支持");
  add("env", "页面来源", location.protocol === "file:" ? "warn" : "ok",
      location.protocol === "file:" ? "file:// （存储与相对路径都不可靠，请通过 http(s) 打开）" : location.protocol);
})();

/* ---------- 存储 ---------- */
(function(){
  var r;
  try {
    localStorage.setItem("wh:probe", "1");
    r = localStorage.getItem("wh:probe") === "1";
    localStorage.removeItem("wh:probe");
    add("store", "localStorage", r ? "ok" : "bad", r ? "可读写（进度/倍速记忆可用）" : "写入后读不到");
  } catch(e) {
    add("store", "localStorage", "bad", errText(e));
  }
  add("store", "indexedDB", "indexedDB" in window ? "ok" : "bad",
      "indexedDB" in window ? "存在" : "不存在");
})();

/* ---------- 异步检测 ---------- */
(async function(){
  /* IndexedDB 真实写入 */
  if("indexedDB" in window){
    try {
      var db = await new Promise(function(res, rej){
        var q = indexedDB.open("wh-probe", 1);
        q.onupgradeneeded = function(){ q.result.createObjectStore("t"); };
        q.onsuccess = function(){ res(q.result); };
        q.onerror = function(){ rej(q.error); };
        q.onblocked = function(){ rej(new Error("blocked")); };
        setTimeout(function(){ rej(new Error("timeout 3s")); }, 3000);
      });
      await new Promise(function(res, rej){
        var tx = db.transaction("t", "readwrite");
        tx.objectStore("t").put("v", "k");
        tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); };
      });
      add("store", "IndexedDB 读写", "ok", "写入成功");
      db.close();
    } catch(e) {
      add("store", "IndexedDB 读写", "bad", errText(e));
    }
  }

  /* Service Worker */
  if(!("serviceWorker" in navigator)){
    add("store", "Service Worker", "bad", "navigator.serviceWorker 不存在");
  } else {
    add("store", "Service Worker", "ok", "navigator.serviceWorker 存在");
    try {
      var reg = await navigator.serviceWorker.register("probe-sw.js", { scope: "./" });
      add("store", "SW 注册", "ok", "注册成功 " + reg.scope);
      reg.unregister();
      facts.sw = true;
    } catch(e) {
      var msg = errText(e);
      if(!facts.secure) {
        add("store", "SW 注册", "warn", msg + "（不安全上下文导致，换 https / localhost 复测才算定论）");
      } else if(/404|Failed to register|bad HTTP response|脚本|load/i.test(msg)) {
        facts.sw = true;
        add("store", "SW 注册", "warn", msg + "（SW 机制本身可用，只是探针脚本缺失；把 probe-sw.js 放到同目录再试）");
      } else {
        add("store", "SW 注册", "bad", msg);
      }
    }
  }

  /* Cache API */
  if(!("caches" in window)){
    add("store", "Cache API", "warn", facts.secure ? "window.caches 不存在（该内核无 Cache API）" : "window.caches 不存在（不安全上下文导致，未定论）");
  } else {
    try {
      var c = await caches.open("wh-probe-v1");
      await c.put(new Request("./__cache_probe__"), new Response("ok"));
      var hit = await c.match("./__cache_probe__");
      await c.delete("./__cache_probe__");
      await caches.delete("wh-probe-v1");
      facts.cache = !!hit;
      add("store", "Cache API", hit ? "ok" : "bad", hit ? "写入并命中成功" : "写入后匹配不到");
    } catch(e) {
      add("store", "Cache API", "bad", errText(e));
    }
  }

  /* 配额 */
  if(navigator.storage && navigator.storage.estimate){
    try {
      var est = await navigator.storage.estimate();
      var gb = function(b){ return (b/1073741824).toFixed(2) + " GB"; };
      add("store", "存储配额", est.quota > 900*1048576 ? "ok" : "warn",
          "已用 " + gb(est.usage||0) + " / 上限 " + gb(est.quota||0) +
          "（目标 0.8 GB，" + (est.quota > 900*1048576 ? "够" : "可能不够") + "）");
    } catch(e) { add("store", "存储配额", "warn", errText(e)); }
  } else {
    add("store", "存储配额", "na", "navigator.storage.estimate 不可用");
  }

  /* persist */
  if(navigator.storage && navigator.storage.persist){
    try {
      var p = await navigator.storage.persist();
      add("store", "持久化存储", p ? "ok" : "warn",
          p ? "已授予（不会被自动清理）" : "未授予（存储紧张时可能被清）");
    } catch(e) { add("store", "持久化存储", "warn", errText(e)); }
  } else {
    add("store", "持久化存储", "na", "navigator.storage.persist 不可用");
  }

  /* ---------- 音频 ---------- */
  var a = document.createElement("audio");
  var types = [
    ['audio/mp4', "m4a / AAC-LC（目标格式）"],
    ['audio/mp4; codecs="mp4a.40.2"', "AAC-LC 显式声明"],
    ['audio/mpeg', "mp3"],
    ['audio/webm; codecs="opus"', "webm / opus（备选压缩）"]
  ];
  types.forEach(function(t){
    var v = a.canPlayType(t[0]);
    var s = v === "probably" ? "ok" : (v === "maybe" ? "warn" : "bad");
    add("audio", "canPlayType " + t[1], s, v ? v : "不支持");
    if(t[0].indexOf("audio/mp4") === 0 && v) facts.aac = true;
  });

  /* 真实解码：4 秒 24kbps 22.05kHz 单声道 AAC（与目标产物同参数） */
  var real = document.createElement("audio");
  real.preload = "metadata";
  real.src = CLIP;
  document.body.appendChild(real);   // 部分内核要求入文档才解析
  var meta = await new Promise(function(res){
    var done = false;
    var fin = function(ok, txt){ if(done) return; done = true; res({ ok: ok, txt: txt }); };
    real.addEventListener("loadedmetadata", function(){
      fin(true, "时长 " + (real.duration||0).toFixed(2) + "s");
    });
    real.addEventListener("error", function(){
      var e = real.error;
      fin(false, "error code " + (e ? e.code : "?") + " — " + (e && e.message ? e.message : "无法解码"));
    });
    setTimeout(function(){ fin(false, "3s 内未触发 loadedmetadata（可能未解析）"); }, 3000);
  });
  add("audio", "实解 24k AAC 片段", meta.ok ? "ok" : "bad", meta.txt);

  if(meta.ok){
    real.currentTime = 2;
    await sleep(120);
    add("audio", "seek 到 2.00s", Math.abs(real.currentTime - 2) < 0.35 ? "ok" : "warn",
        "currentTime = " + real.currentTime.toFixed(2));
    real.playbackRate = 1.5;
    await sleep(50);
    add("audio", "playbackRate 1.5×", Math.abs(real.playbackRate - 1.5) < 0.01 ? "ok" : "warn",
        "读回 " + real.playbackRate);
    real.playbackRate = 1;
  }

  /* 播放按钮（需要用户手势，自动播放会被拦） */
  document.getElementById("playBtn").addEventListener("click", async function(){
    try {
      real.currentTime = 0;
      await real.play();
      await sleep(600);
      add("audio", "手势播放", real.paused === false || real.currentTime > 0 ? "ok" : "warn",
          "currentTime = " + real.currentTime.toFixed(2) + "（能出声即为通过）");
    } catch(e) {
      add("audio", "手势播放", "bad", errText(e));
    }
    real.pause();
    finish();
  });

  /* ---------- 手机形态 ---------- */
  var ms = navigator.mediaSession;
  add("mobile", "Media Session", ms ? "ok" : "bad", ms ? "存在（锁屏可显示标题/上一集下一集）" : "不存在（锁屏只剩系统默认控件）");
  if(ms && ms.setActionHandler){
    var acts = ["play","pause","seekbackward","seekforward","previoustrack","nexttrack","seekto"];
    var okActs = [], badActs = [];
    acts.forEach(function(k){
      try { ms.setActionHandler(k, function(){}); okActs.push(k); }
      catch(e) { badActs.push(k); }
    });
    add("mobile", "Media 按键接管", badActs.length ? "warn" : "ok",
        "支持 " + okActs.join("/") + (badActs.length ? "；不支持 " + badActs.join("/") : ""));
    try {
      ms.setPositionState({ duration: 4, position: 1, playbackRate: 1 });
      add("mobile", "setPositionState", "ok", "可设进度");
    } catch(e) { add("mobile", "setPositionState", "warn", errText(e)); }
  }

  add("mobile", "Wake Lock", "wakeLock" in navigator ? "ok" : "na",
      "wakeLock" in navigator ? "存在（可防熄屏）" : "不存在（长句跟读时可能自动锁屏）");
  var dvh = !!(window.CSS && CSS.supports && CSS.supports("height", "100dvh"));
  add("mobile", "100dvh", dvh ? "ok" : "warn", dvh ? "支持" : "不支持，需 vh 回退");
  add("mobile", "display-mode", "na", window.matchMedia("(display-mode: standalone)").matches
      ? "standalone（已作为应用打开）" : "browser（普通标签页）");
  add("mobile", "视口", "na", innerWidth + "×" + innerHeight + " @" + (window.devicePixelRatio||1) + "x");

  finish();
})();

function finish(){
  var lines = report.slice();
  lines.push("");
  lines.push("结论: " + verdictText());
  document.getElementById("raw").textContent = lines.join("\n");
  setVerdict();
}
function verdictText(){
  if(location.protocol === "file:") return "file:// 打开，存储类结果全部无效，请改用 http(s)。";
  if(!facts.secure) return "非安全上下文：SW/Cache 无法生效，需换 https 或 localhost 复测才能定论。";
  if(!facts.sw) return "安全上下文下 SW 仍不可用 → 只能走「手机本地服务器」路线。";
  if(!facts.cache) return "SW 可用但 Cache API 不可用 → 不适合预下载，建议走本地服务器路线。";
  return "PWA 路线可行：SW + Cache 均可用。";
}
function setVerdict(){
  var n = document.getElementById("verdict");
  var txt = verdictText();
  n.className = "verdict " + (txt.indexOf("可行") >= 0 ? "ok" : (txt.indexOf("只能") >= 0 ? "bad" : "warn"));
  n.textContent = txt;
  var s = document.createElement("small");
  s.textContent = "AAC 解码: " + (facts.aac ? "支持" : "不支持") +
    " · 安全上下文: " + (facts.secure ? "是" : "否") +
    " · SW: " + (facts.sw ? "可用" : "不可用") +
    " · Cache: " + (facts.cache ? "可用" : "不可用");
  n.appendChild(s);
}
document.getElementById("copyBtn").addEventListener("click", async function(){
  var t = document.getElementById("raw").textContent;
  try {
    await navigator.clipboard.writeText(t);
    this.textContent = "已复制 ✓";
  } catch(e) {
    var ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); this.textContent = "已复制 ✓"; }
    catch(e2) { this.textContent = "复制失败，请手动长按上方文本"; }
    ta.remove();
  }
  var btn = this;
  setTimeout(function(){ btn.textContent = "复制报告"; }, 2500);
});
</script>
